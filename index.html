<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5手帳 — Notatnik N5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF7;
    --surface:#FFFFFF;
    --text:#1E1B18;
    --text-muted:#6B6459;
    --border:#DEDACF;
    --accent:#BC002D;
    --accent-contrast:#FFFFFF;
    --accent-tint:#F6E4E6;
    --chip-bg:#F1EFE8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181613;
      --surface:#211E1A;
      --text:#EDE9E1;
      --text-muted:#A69E8F;
      --border:#3A362F;
      --accent:#E23A55;
      --accent-contrast:#181613;
      --accent-tint:#3A1E22;
      --chip-bg:#2A2620;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181613;
    --surface:#211E1A;
    --text:#EDE9E1;
    --text-muted:#A69E8F;
    --border:#3A362F;
    --accent:#E23A55;
    --accent-contrast:#181613;
    --accent-tint:#3A1E22;
    --chip-bg:#2A2620;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    margin:0 0 8px;
    color:var(--text);
  }
  a{ color:var(--accent); }
  button{ font-family:inherit; }

  .shell{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 8px 18px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
  }
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .brand-text{ line-height:1.25; }
  .brand-text strong{ font-family:'Noto Serif JP', serif; font-size:16px; display:block; }
  .brand-text span{ font-size:11px; color:var(--text-muted); }

  .navlist{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .navlist button{
    text-align:left;
    padding:9px 10px;
    border:none;
    background:none;
    color:var(--text-muted);
    font-size:13.5px;
    border-radius:3px;
    cursor:pointer;
  }
  .navlist button:hover{ background:var(--chip-bg); color:var(--text); }
  .navlist button.active{
    background:var(--accent-tint);
    color:var(--accent);
    font-weight:700;
  }

  .sidebar-footer{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--text-muted);
    text-align:left;
  }

  /* Top-right theme switcher */
  .theme-switch{
    position:fixed;
    top:16px;
    right:20px;
    z-index:30;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 6px;
  }
  .theme-switch button{
    border:none;
    background:none;
    cursor:pointer;
    font-size:14px;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
  }
  .theme-switch button.active{
    background:var(--accent-tint);
    color:var(--accent);
  }

  /* Content */
  .content{ flex:1; padding:36px 44px 80px; max-width:920px; }
  .page{ display:none; }
  .page.active{ display:block; }

  .eyebrow-count{ font-size:12px; color:var(--text-muted); margin-bottom:26px; }

  /* Home */
  .hero{
    border-bottom:1px solid var(--border);
    padding-bottom:22px;
    margin-bottom:26px;
    padding-right:60px;
  }
  .hero h1{ font-size:26px; }
  .hero p{ color:var(--text-muted); max-width:60ch; margin:0; }
  .countdown{
    display:inline-block;
    margin-top:14px;
    font-size:13px;
    color:var(--accent);
    font-weight:700;
  }
  .linkgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
  }
  .linkgrid button{
    background:var(--surface);
    border:none;
    padding:18px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
  }
  .linkgrid button:hover{ background:var(--accent-tint); }
  .linkgrid strong{ display:block; font-family:'Noto Serif JP', serif; font-size:15px; margin-bottom:3px; }
  .linkgrid span{ font-size:12.5px; color:var(--text-muted); }

  .countdown-card{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:48px;
    padding:28px 32px;
    background:var(--accent-tint);
    border:1px solid var(--border);
  }
  .countdown-sun{ width:88px; height:88px; flex-shrink:0; }
  .countdown-text{ line-height:1.2; }
  .countdown-days{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:52px;
    color:var(--accent);
  }
  .countdown-label{ font-size:15px; color:var(--text); margin-top:2px; }
  .countdown-date{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }

  /* Lesson picker */
  .lesson-select-row{ margin-bottom:20px; }
  .lesson-select{
    font-family:inherit;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:3px;
    cursor:pointer;
  }
  .lesson-nav{ display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  .lesson-nav button{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:10px 16px;
    border-radius:3px;
    cursor:pointer;
    font-size:13.5px;
  }
  .lesson-nav button:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .lesson-nav button:disabled{ opacity:0.35; cursor:default; }

  /* Filters (vocab) */
  .filter-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .filter-row select{
    font-family:inherit;
    padding:9px 12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:13.5px;
    border-radius:3px;
    cursor:pointer;
  }
  .pill-cat{
    font-size:11px;
    padding:2px 8px;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-muted);
    background:var(--chip-bg);
  }

  .lesson-block{
    border:1px solid var(--border);
    margin-bottom:16px;
  }
  .lesson-head{
    background:var(--chip-bg);
    padding:10px 16px;
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:15px;
    border-bottom:1px solid var(--border);
  }
  .grammar-item{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .grammar-item:last-child{ border-bottom:none; }
  .g-pattern{ font-size:16px; font-weight:700; margin-bottom:4px; }
  .g-explain{ color:var(--text-muted); font-size:13.5px; margin-bottom:6px; }
  .g-example{ font-size:14px; background:var(--bg); border-left:3px solid var(--accent); padding:8px 12px; }
  .g-example .en{ color:var(--text-muted); font-size:12.5px; margin-top:2px; }

  /* Tables */
  .searchbar{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    margin-bottom:14px;
    border-radius:3px;
  }
  .searchbar:focus{ outline:none; border-color:var(--accent); }
  table.data{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.data th{
    text-align:left;
    font-size:11.5px;
    text-transform:none;
    color:var(--text-muted);
    border-bottom:1px solid var(--border);
    padding:8px 10px;
    font-weight:700;
  }
  table.data td{
    padding:9px 10px;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  table.data tr:hover td{ background:var(--chip-bg); }
  .kanji-cell{ font-size:19px; font-family:'Noto Serif JP', serif; }
  .note-box{
    border:1px dashed var(--border);
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:16px;
  }

  /* Checklist */
  .check-group{ margin-bottom:22px; }
  .check-group h3{ font-size:14px; border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:8px; }
  .check-row{ display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:14px; }
  .check-row input{ margin-top:4px; accent-color:var(--accent); }

  /* Link list (practice/resources) */
  .reslist{ list-style:none; margin:0; padding:0; }
  .reslist li{
    border-bottom:1px solid var(--border);
    padding:12px 4px;
  }
  .reslist a{ font-weight:700; text-decoration:none; }
  .reslist a:hover{ text-decoration:underline; }
  .reslist p{ margin:3px 0 0; font-size:13px; color:var(--text-muted); }

  @media (max-width:800px){
    .shell{ flex-direction:column; }
    .sidebar{
      width:100%; height:auto; position:sticky; top:0;
      flex-direction:row; align-items:center;
      overflow-x:auto; padding:10px;
      z-index:20;
    }
    .brand{ display:none; }
    .navlist{ flex-direction:row; }
    .navlist button{ white-space:nowrap; }
    .sidebar-footer{ display:none; }
    .content{ padding:56px 18px 60px; }
    .hero{ padding-right:0; }
    .linkgrid{ grid-template-columns:1fr; }
    .countdown-card{ flex-direction:column; text-align:center; padding:24px 20px; }
  }
</style>
</head>

<div class="theme-switch" id="theme-switch">

  <button id="theme-dark-btn" type="button" title="Tryb ciemny">🌙</button>
</div>

<div class="shell">

    <div class="brand">
      <div class="dot"></div>
      <div class="brand-text">

<script>
/* ---------------- THEME ---------------- */
(function(){
  const root = document.documentElement;
  const lightBtn = document.getElementById('theme-light-btn');
  const darkBtn = document.getElementById('theme-dark-btn');

  function getStored(){
    try{ return localStorage.getItem('n5-theme'); }catch(e){ return null; }
  }
  function setStored(v){
    try{ localStorage.setItem('n5-theme', v); }catch(e){}
  }
  function apply(theme){
    root.setAttribute('data-theme', theme);
    lightBtn.classList.toggle('active', theme === 'light');
    darkBtn.classList.toggle('active', theme === 'dark');
  }

  let current = getStored() || 'light';
  apply(current);

  lightBtn.addEventListener('click', () => { current = 'light'; apply(current); setStored(current); });
  darkBtn.addEventListener('click', () => { current = 'dark'; apply(current); setStored(current); });
})();

let currentGrammarLesson = 0;

function grammarLessonBody(index){
  const l = grammarData[index];
  const isFirst = index === 0;
  const isLast = index === grammarData.length - 1;
  const body = l.ready ? `
    <div class="lesson-block">
      ${l.items.map(it => `
        <div class="grammar-item">
          <div class="g-pattern">${it.pattern}</div>
          <div class="g-explain">${it.explain}</div>
          <div class="g-example">${it.jp}<div class="en">${it.en}</div></div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="note-box">Treść tej lekcji jeszcze nie została dodana — wróć tu później.</div>`;
  return `
    <div class="lesson-select-row">
      <select class="lesson-select" onchange="goToGrammarLesson(this.value)">
        ${grammarData.map((g,i) => `<option value="${i}" ${i===index?'selected':''}>${g.lesson}</option>`).join('')}
      </select>
    </div>
    ${body}
    <div class="lesson-nav">
      <button ${isFirst?'disabled':''} onclick="goToGrammarLesson(${index-1})">← Poprzednia lekcja</button>
      <button ${isLast?'disabled':''} onclick="goToGrammarLesson(${index+1})">Następna lekcja →</button>
    </div>
  `;
}

function goToGrammarLesson(i){
  i = Number(i);
  if(i < 0 || i >= grammarData.length) return;
  currentGrammarLesson = i;
  const el = document.getElementById('grammar-body');
  if(el) el.innerHTML = grammarLessonBody(i);
  window.scrollTo(0,0);
}

function grammarPage(){
  return `
    <h2>Gramatyka</h2>
    <div class="eyebrow-count">Lekcje 1–5 uzupełnione · reszta dochodzi na bieżąco</div>
    <div id="grammar-body">${grammarLessonBody(currentGrammarLesson)}</div>
    <div class="note-box">Wyjaśnienia gramatyki pochodzą z pamięci na podstawie Minna no Nihongo I — warto porównać z własnym podręcznikiem i zgłosić wszystko, co wygląda podejrzanie, żeby to poprawić.</div>
  `;
}

function vocabPage(){
  const lessons = [...new Set(vocabData.map(v => v.lesson))].sort((a,b) => a - b);
  const categories = [...new Set(vocabData.map(v => v.category))];
  return `
    <h2>Słownictwo</h2>
    <div class="eyebrow-count">Lekcje 1, 2, 4, 5 · ${vocabData.length} słów jak dotąd</div>
    <input class="searchbar" id="vocab-search" placeholder="Szukaj po kanji, hiraganie lub znaczeniu..." oninput="filterVocab()">
    <div class="filter-row">
      <select id="vocab-lesson-filter" onchange="filterVocab()">
        <option value="">Wszystkie lekcje</option>
        ${lessons.map(l => `<option value="${l}">Lekcja ${l}</option>`).join('')}
      </select>
      <select id="vocab-category-filter" onchange="filterVocab()">
        <option value="">Wszystkie kategorie</option>
        ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <table class="data" id="vocab-table">
      <thead><tr><th>Kanji</th><th>Hiragana</th><th>Znaczenie</th><th>Kategoria</th><th>Lekcja</th></tr></thead>
      <tbody>
        ${vocabData.map(v => `<tr data-lesson="${v.lesson}" data-category="${v.category}"><td class="kanji-cell">${v.kanji}</td><td>${v.hira}</td><td>${v.meaning}</td><td><span class="pill-cat">${v.category}</span></td><td>${v.lesson}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

function filterVocab(){
  const q = (document.getElementById('vocab-search').value || '').trim().toLowerCase();
  const lessonVal = document.getElementById('vocab-lesson-filter').value;
  const catVal = document.getElementById('vocab-category-filter').value;
  const rows = document.querySelectorAll('#vocab-table tbody tr');
  rows.forEach(r => {
    const matchesText = r.textContent.toLowerCase().includes(q);
    const matchesLesson = !lessonVal || r.dataset.lesson === lessonVal;
    const matchesCat = !catVal || r.dataset.category === catVal;
    r.style.display = (matchesText && matchesLesson && matchesCat) ? '' : 'none';
  });
}

function kanjiPage(){
  return `
    <h2>Kanji</h2>
    <div class="eyebrow-count">${kanjiData.length} z ok. 100 kanji N5 jak dotąd</div>
    <input class="searchbar" id="kanji-search" placeholder="Szukaj po kanji, odczycie lub znaczeniu..." oninput="filterTable('kanji-search','kanji-table')">

  `;
}

/* ---------------- ROUTER ---------------- */

const pages = [
  { id:'home', label:'Strona główna', render:homePage },
  { id:'grammar', label:'Gramatyka', render:grammarPage },
  { id:'vocab', label:'Słownictwo', render:vocabPage },
  { id:'kanji', label:'Kanji', render:kanjiPage },
  { id:'resources', label:'Materiały', render:resourcesPage },
];

const navlist = document.getElementById('navlist');
const contentEl = document.getElementById('content');

pages.forEach(p => {
  const btn = document.createElement('button');
  btn.textContent = p.label;
  btn.id = 'nav-' + p.id;
  btn.onclick = () => goTo(p.id);
  navlist.appendChild(btn);
});

function goTo(id){
  const page = pages.find(p => p.id === id);
  if(!page) return;
  contentEl.innerHTML = page.render();
  pages.forEach(p => document.getElementById('nav-' + p.id).classList.toggle('active', p.id === id));
  window.scrollTo(0,0);
}

function filterTable(inputId, tableId){
  const q = document.getElementById(inputId).value.trim().toLowerCase();
  const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
  rows.forEach(r => {
    const text = r.textContent.toLowerCase();
    r.style.display = text.includes(q) ? '' : 'none';
  });
}

goTo('home');

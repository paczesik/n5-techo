<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5手帳 — Notatnik N5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF7;
    --surface:#FFFFFF;
    --text:#1E1B18;
    --text-muted:#6B6459;
    --border:#DEDACF;
    --accent:#BC002D;
    --accent-contrast:#FFFFFF;
    --accent-tint:#F6E4E6;
    --chip-bg:#F1EFE8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181613;
      --surface:#211E1A;
      --text:#EDE9E1;
      --text-muted:#A69E8F;
      --border:#3A362F;
      --accent:#E23A55;
      --accent-contrast:#181613;
      --accent-tint:#3A1E22;
      --chip-bg:#2A2620;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181613;
    --surface:#211E1A;
    --text:#EDE9E1;
    --text-muted:#A69E8F;
    --border:#3A362F;
    --accent:#E23A55;
    --accent-contrast:#181613;
    --accent-tint:#3A1E22;
    --chip-bg:#2A2620;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    margin:0 0 8px;
    color:var(--text);
  }
  a{ color:var(--accent); }
  button{ font-family:inherit; }

  .shell{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 8px 18px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
    cursor:pointer;
    border-radius:6px;
  }
  .brand:hover{ background:var(--chip-bg); }
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .brand-text{ line-height:1.25; flex:1; }
  .brand-text strong{ font-family:'Noto Serif JP', serif; font-size:16px; display:block; }
  .brand-text span{ font-size:11px; color:var(--text-muted); }
  .sidebar-hide{
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .sidebar-hide:hover{ border-color:var(--accent); color:var(--accent); }

  .sidebar.hidden{ display:none; }
  .sidebar-reopen{
    display:none;
    position:fixed;
    top:16px;
    left:20px;
    z-index:30;
    width:34px;
    height:34px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .sidebar-reopen.visible{ display:flex; }
  .sidebar-reopen:hover{ border-color:var(--accent); color:var(--accent); }

  .navlist{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .navlist button{
    text-align:left;
    padding:9px 10px;
    border:none;
    background:none;
    color:var(--text-muted);
    font-size:13.5px;
    border-radius:6px;
    cursor:pointer;
  }
  .navlist button:hover{ background:var(--chip-bg); color:var(--text); }
  .navlist button.active{
    background:var(--accent-tint);
    color:var(--accent);
    font-weight:700;
  }

  .sidebar-footer{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--text-muted);
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .footer-mail{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:6px;
    border:1px solid var(--border);
    color:var(--text-muted);
    flex-shrink:0;
  }
  .footer-mail:hover{ border-color:var(--accent); color:var(--accent); }

  /* Top-right theme switcher */
  .theme-switch{
    position:fixed;
    top:16px;
    right:20px;
    z-index:30;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 6px;
  }
  .theme-switch button{
    border:none;
    background:none;
    cursor:pointer;
    font-size:14px;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
  }
  .theme-switch button.active{
    background:var(--accent-tint);
    color:var(--accent);
  }

  /* Content */
  .content{ flex:1; padding:36px 44px 80px; max-width:920px; }
  .page{ display:none; }
  .page.active{ display:block; }

  .eyebrow-count{ font-size:12px; color:var(--text-muted); margin-bottom:26px; }

  /* Home */
  .hero{
    border-bottom:1px solid var(--border);
    padding-bottom:22px;
    margin-bottom:26px;
    padding-right:60px;
  }
  .hero h1{ font-size:26px; }
  .hero p{ color:var(--text-muted); max-width:60ch; margin:0; }
  .countdown{
    display:inline-block;
    margin-top:14px;
    font-size:13px;
    color:var(--accent);
    font-weight:700;
  }
  .linkgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .linkgrid button{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
  }
  .linkgrid button:hover{ background:var(--accent-tint); border-color:var(--accent); }
  .linkgrid strong{ display:block; font-family:'Noto Serif JP', serif; font-size:15px; margin-bottom:3px; }
  .linkgrid span{ font-size:12.5px; color:var(--text-muted); }

  .countdown-card{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:48px;
    padding:28px 32px;
    background:var(--accent-tint);
    border:1px solid var(--border);
    border-radius:18px;
  }
  .countdown-sun{ width:88px; height:88px; flex-shrink:0; }
  .countdown-text{ line-height:1.2; }
  .countdown-days{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:52px;
    color:var(--accent);
  }
  .countdown-label{ font-size:15px; color:var(--text); margin-top:2px; }
  .countdown-date{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }

  /* Lesson picker */
  .lesson-select-row{ margin-bottom:20px; }
  .lesson-select{
    font-family:inherit;
    font-size:14px;
    padding:10px 38px 10px 14px;
    border:1px solid var(--border);
    background-color:var(--surface);
    color:var(--text);
    border-radius:6px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6459' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:12px;
  }
  .lesson-nav{ display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  .lesson-nav button{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-size:13.5px;
  }
  .lesson-nav button:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .lesson-nav button:disabled{ opacity:0.35; cursor:default; }

  /* Filters (vocab) */
  .filter-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .filter-row select{
    font-family:inherit;
    padding:9px 34px 9px 12px;
    border:1px solid var(--border);
    background-color:var(--surface);
    color:var(--text);
    font-size:13.5px;
    border-radius:6px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6459' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:11px;
  }
  .pill-cat{
    font-size:11px;
    padding:2px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text-muted);
    background:var(--chip-bg);
  }

  .lesson-block{
    border:1px solid var(--border);
    margin-bottom:16px;
  }
  .lesson-head{
    background:var(--chip-bg);
    padding:10px 16px;
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:15px;
    border-bottom:1px solid var(--border);
  }
  .grammar-item{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .grammar-item:last-child{ border-bottom:none; }
  .g-pattern{ font-size:16px; font-weight:700; margin-bottom:4px; }
  .g-explain{ color:var(--text-muted); font-size:13.5px; margin-bottom:6px; }
  .g-example{ font-size:14px; background:var(--bg); border-left:3px solid var(--accent); padding:8px 12px; }
  .g-example .en{ color:var(--text-muted); font-size:12.5px; margin-top:2px; }

  /* Tables */
  .searchbar{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    margin-bottom:14px;
    border-radius:6px;
  }
  .searchbar:focus{ outline:none; border-color:var(--accent); }
  table.data{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.data th{
    text-align:left;
    font-size:11.5px;
    text-transform:none;
    color:var(--text-muted);
    border-bottom:1px solid var(--border);
    padding:8px 10px;
    font-weight:700;
  }
  table.data td{
    padding:9px 10px;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  table.data tr:hover td{ background:var(--chip-bg); }
  .kanji-cell{
    font-size:19px;
    font-family:'Noto Serif JP', serif;
    position:relative;
    cursor:default;
  }
  .kanji-cell:hover::after{
    content: attr(data-k);
    position:absolute;
    left:0;
    bottom:100%;
    margin-bottom:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 18px;
    font-size:52px;
    line-height:1;
    font-family:'Noto Serif JP', serif;
    box-shadow:0 6px 20px rgba(0,0,0,0.18);
    z-index:60;
    white-space:nowrap;
    color:var(--text);
    pointer-events:none;
  }
  .note-box{
    border:1px dashed var(--border);
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:16px;
  }

  /* Link list (practice/resources) */
  .reslist{ list-style:none; margin:0; padding:0; }
  .reslist li{ border-bottom:1px solid var(--border); padding:12px 4px; }
  .reslist a{ font-weight:700; text-decoration:none; }
  .reslist a:hover{ text-decoration:underline; }
  .reslist p{ margin:3px 0 0; font-size:13px; color:var(--text-muted); }

  /* Resource groups */
  .res-group{ margin-bottom:28px; }
  .res-group h3{
    display:inline-block;
    font-family:'Noto Sans JP', sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-tint);
    padding:6px 12px;
    border-radius:6px;
    margin:0 0 12px;
  }
  .res-group .reslist{ border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .res-group .reslist li{ padding:14px 16px; }
  .res-group .reslist li:last-child{ border-bottom:none; }

  /* Mobile hamburger + backdrop */
  .mobile-menu-btn{
    display:none;
    position:fixed;
    top:14px;
    left:16px;
    z-index:50;
    width:42px;
    height:42px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .mobile-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:39;
  }
  .mobile-backdrop.visible{ display:block; }

  @media (max-width:800px){
    .shell{ flex-direction:column; }
    .mobile-menu-btn{ display:flex; }
    .sidebar-reopen{ display:none !important; }
    .sidebar{
      position:fixed;
      top:0; left:0;
      width:82%;
      max-width:320px;
      height:100vh;
      transform:translateX(-100%);
      transition:transform 0.25s ease;
      z-index:40;
      flex-direction:column;
      padding:20px 16px;
      box-shadow:4px 0 24px rgba(0,0,0,0.2);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .brand{ display:flex; }
    .navlist{ flex-direction:column; }
    .navlist button{ white-space:normal; font-size:16.5px; padding:15px 14px; }
    .sidebar-footer{ display:flex; font-size:13px; }
    .footer-mail{ width:32px; height:32px; }

    .content{ padding:76px 18px 60px; }
    .hero{ padding-right:0; }
    .linkgrid{ grid-template-columns:1fr; }
    .linkgrid button{ padding:20px; }
    .countdown-card{ flex-direction:column; text-align:center; padding:24px 20px; }

    /* Bigger, more tappable controls */
    .theme-switch button{ width:34px; height:34px; font-size:16px; }
    .lesson-select{
      width:100%;
      font-size:16px;
      padding:14px 42px 14px 16px;
      background-position:right 16px center;
      background-size:14px;
    }
    .lesson-nav{ flex-direction:column; }
    .lesson-nav button{ width:100%; padding:15px 16px; font-size:15px; }
    .filter-row{ flex-direction:column; }
    .filter-row select{
      width:100%;
      font-size:16px;
      padding:14px 42px 14px 16px;
      background-position:right 16px center;
      background-size:14px;
    }
    .searchbar{ font-size:16px; padding:14px 16px; }
    table.data th, table.data td{ padding:11px 8px; font-size:13px; }
    .kanji-cell{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="theme-switch" id="theme-switch">
  <button id="theme-light-btn" type="button" title="Tryb jasny">☀️</button>
  <button id="theme-dark-btn" type="button" title="Tryb ciemny">🌙</button>
</div>

<button class="sidebar-reopen" id="sidebar-reopen-btn" type="button" title="Pokaż panel" aria-label="Pokaż panel">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<button class="mobile-menu-btn" id="mobile-menu-btn" type="button" title="Menu" aria-label="Otwórz menu">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div class="mobile-backdrop" id="mobile-backdrop"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand" id="brand-home" role="button" tabindex="0" title="Strona główna">
      <div class="dot"></div>
      <div class="brand-text">
        <strong>N5手帳</strong>
        <span>Notatnik N5</span>
      </div>
      <button class="sidebar-hide" id="sidebar-hide-btn" type="button" title="Ukryj panel" aria-label="Ukryj panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="navlist" id="navlist"></div>
    <div class="sidebar-footer">
      <div>⋅ by paczes ⋅</div>
      <a class="footer-mail" href="mailto:arkd@pm.me" title="arkd@pm.me" aria-label="Wyślij e-mail">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 7 9-7"/></svg>
      </a>
    </div>
  </aside>

  <main class="content" id="content"></main>
</div>

<script>
/* ---------------- THEME ---------------- */
(function(){
  const root = document.documentElement;
  const lightBtn = document.getElementById('theme-light-btn');
  const darkBtn = document.getElementById('theme-dark-btn');

  function getStored(){
    try{ return localStorage.getItem('n5-theme'); }catch(e){ return null; }
  }
  function setStored(v){
    try{ localStorage.setItem('n5-theme', v); }catch(e){}
  }
  function apply(theme){
    root.setAttribute('data-theme', theme);
    lightBtn.classList.toggle('active', theme === 'light');
    darkBtn.classList.toggle('active', theme === 'dark');
  }

  let current = getStored() || 'light';
  apply(current);

  lightBtn.addEventListener('click', () => { current = 'light'; apply(current); setStored(current); });
  darkBtn.addEventListener('click', () => { current = 'dark'; apply(current); setStored(current); });
})();

/* ---------------- SIDEBAR ---------------- */
const mobileQuery = window.matchMedia('(max-width:800px)');

function openSidebar(){
  const sidebar = document.querySelector('.sidebar');
  if(mobileQuery.matches){
    sidebar.classList.add('mobile-open');
    document.getElementById('mobile-backdrop').classList.add('visible');
  } else {
    sidebar.classList.remove('hidden');
    document.getElementById('sidebar-reopen-btn').classList.remove('visible');
  }
}
function closeSidebar(){
  const sidebar = document.querySelector('.sidebar');
  if(mobileQuery.matches){
    sidebar.classList.remove('mobile-open');
    document.getElementById('mobile-backdrop').classList.remove('visible');
  } else {
    sidebar.classList.add('hidden');
    document.getElementById('sidebar-reopen-btn').classList.add('visible');
  }
}

(function(){
  const hideBtn = document.getElementById('sidebar-hide-btn');
  const reopenBtn = document.getElementById('sidebar-reopen-btn');
  const menuBtn = document.getElementById('mobile-menu-btn');
  const backdrop = document.getElementById('mobile-backdrop');
  const brand = document.getElementById('brand-home');

  hideBtn.addEventListener('click', (e) => { e.stopPropagation(); closeSidebar(); });
  reopenBtn.addEventListener('click', () => openSidebar());
  menuBtn.addEventListener('click', () => openSidebar());
  backdrop.addEventListener('click', () => closeSidebar());
  brand.addEventListener('click', () => { goTo('home'); if(mobileQuery.matches) closeSidebar(); });
  brand.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo('home'); if(mobileQuery.matches) closeSidebar(); } });
})();

/* ---------------- DATA ---------------- */

const grammarData = [
  {
    lesson:'Lekcja 1', ready:true,
    items:[
      { pattern:'N1は N2です', explain:'N1 to N2. Podstawowe zdanie tożsamościowe z partykułą tematu は (czyt. "wa").', jp:'わたしは マイク・ミラーです。', en:'Jestem Mike Miller.' },
      { pattern:'N1は N2ですか', explain:'Forma pytająca. Dodajemy か na końcu; nie potrzeba znaku zapytania, intonacja rośnie zamiast tego.', jp:'サントスさんは がくせいですか。', en:'Czy pan Santos jest studentem?' },
      { pattern:'N1は N2じゃ(では)ありません', explain:'Forma przecząca です. じゃ jest potoczne, では bardziej formalne / pisane.', jp:'わたしは がくせいじゃありません。', en:'Nie jestem studentem.' },
      { pattern:'N1も N2です', explain:'"Też". も zastępuje は, gdy dodajemy podobny fakt o innym temacie.', jp:'ミラーさんも かいしゃいんです。', en:'Pan Miller też jest pracownikiem firmy.' },
      { pattern:'N1の N2', explain:'の łączy dwa rzeczowniki, zwykle pokazując przynależność (firma, dział itd.).', jp:'わたしは IMCの エンジニアです。', en:'Jestem inżynierem w IMC.' },
    ]
  },
  {

let currentGrammarLesson = 0;

function grammarLessonBody(index){
  const l = grammarData[index];
  const isFirst = index === 0;
  const isLast = index === grammarData.length - 1;
  const body = l.ready ? `
    <div class="lesson-block">
      ${l.items.map(it => `
        <div class="grammar-item">
          <div class="g-pattern">${it.pattern}</div>
          <div class="g-explain">${it.explain}</div>
          <div class="g-example">${it.jp}<div class="en">${it.en}</div></div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="note-box">Treść tej lekcji jeszcze nie została dodana — wróć tu później.</div>`;
  return `
    <div class="lesson-select-row">
      <select class="lesson-select" onchange="goToGrammarLesson(this.value)">
        ${grammarData.map((g,i) => `<option value="${i}" ${i===index?'selected':''}>${g.lesson}</option>`).join('')}
      </select>
    </div>
    ${body}
    <div class="lesson-nav">
      <button ${isFirst?'disabled':''} onclick="goToGrammarLesson(${index-1})">← Poprzednia lekcja</button>
      <button ${isLast?'disabled':''} onclick="goToGrammarLesson(${index+1})">Następna lekcja →</button>
    </div>
  `;
}

function goToGrammarLesson(i){
  i = Number(i);
  if(i < 0 || i >= grammarData.length) return;
  currentGrammarLesson = i;
  const el = document.getElementById('grammar-body');
  if(el) el.innerHTML = grammarLessonBody(i);
  window.scrollTo(0,0);
}

function grammarPage(){
  return `
    <h2>Gramatyka</h2>
    <div class="eyebrow-count">Wszystkie 25 lekcji (Minna no Nihongo I)</div>
    <div id="grammar-body">${grammarLessonBody(currentGrammarLesson)}</div>
    <div class="note-box">Wyjaśnienia gramatyki pochodzą z pamięci na podstawie Minna no Nihongo I — warto porównać z własnym podręcznikiem i zgłosić wszystko, co wygląda podejrzanie, żeby to poprawić.</div>
  `;
}

function vocabPage(){
  const lessons = [...new Set(vocabData.map(v => v.lesson))].sort((a,b) => a - b);
  const categories = [...new Set(vocabData.map(v => v.category))];
  return `
    <h2>Słownictwo</h2>
    <div class="eyebrow-count">Wszystkie 25 lekcji · ${vocabData.length} słów</div>
    <input class="searchbar" id="vocab-search" placeholder="Szukaj po kanji, hiraganie lub znaczeniu..." oninput="filterVocab()">
    <div class="filter-row">
      <select id="vocab-lesson-filter" onchange="filterVocab()">
        <option value="">Wszystkie lekcje</option>
        ${lessons.map(l => `<option value="${l}">Lekcja ${l}</option>`).join('')}
      </select>
      <select id="vocab-category-filter" onchange="filterVocab()">
        <option value="">Wszystkie kategorie</option>
        ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <table class="data" id="vocab-table">
      <thead><tr><th>Kanji</th><th>Hiragana</th><th>Znaczenie</th><th>Kategoria</th><th>Lekcja</th></tr></thead>
      <tbody>
        ${vocabData.map(v => `<tr data-lesson="${v.lesson}" data-category="${v.category}"><td class="kanji-cell" data-k="${v.kanji}">${v.kanji}</td><td>${v.hira}</td><td>${v.meaning}</td><td><span class="pill-cat">${v.category}</span></td><td>${v.lesson}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

function filterVocab(){
  const q = (document.getElementById('vocab-search').value || '').trim().toLowerCase();
  const lessonVal = document.getElementById('vocab-lesson-filter').value;
  const catVal = document.getElementById('vocab-category-filter').value;
  const rows = document.querySelectorAll('#vocab-table tbody tr');
  rows.forEach(r => {
    const matchesText = r.textContent.toLowerCase().includes(q);
    const matchesLesson = !lessonVal || r.dataset.lesson === lessonVal;
    const matchesCat = !catVal || r.dataset.category === catVal;
    r.style.display = (matchesText && matchesLesson && matchesCat) ? '' : 'none';
  });
}

function goTo(id){
  const page = pages.find(p => p.id === id);
  if(!page) return;
  contentEl.innerHTML = page.render();
  pages.forEach(p => document.getElementById('nav-' + p.id).classList.toggle('active', p.id === id));
  window.scrollTo(0,0);
}

function filterTable(inputId, tableId){
  const q = document.getElementById(inputId).value.trim().toLowerCase();
  const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
  rows.forEach(r => {
    const text = r.textContent.toLowerCase();
    r.style.display = text.includes(q) ? '' : 'none';
  });
}

goTo('home');
</script>
